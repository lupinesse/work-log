name: ChatGPT PR Review

# Posts an automated ChatGPT code review as inline PR comments.
#
# Triggers two ways:
#   1. 'labeled' event with label == 'chatgpt-review'  — manual labeling
#   2. 'opened' or 'reopened' — size thresholds evaluated inline so the review
#      runs even when the label was applied by auto-label-pr.yml (which uses
#      GITHUB_TOKEN; GitHub suppresses the resulting labeled event for other
#      workflows, so chatgpt-pr-review would never fire without this path).
#
# Size thresholds (matching auto-label-pr.yml):
#   ≥ 200 source-line changes  OR  ≥ 4 source files changed
#   Generated files excluded: script.js, styles.css, docs/*.html, package-lock.json
#
# Required secrets:
#   OPENAI_API_KEY              — OpenAI API key for the ChatGPT review call
#   CHATGPT_REVIEWER_APP_ID     — App ID of the "ChatGPT Reviewer" GitHub App
#   CHATGPT_REVIEWER_PRIVATE_KEY — .pem private key of the same App
# The GitHub App must be installed on this repo with permissions:
#   Contents: read · Pull requests: write
# An installation token is minted at runtime via actions/create-github-app-token@v2
# and passed to anc95/ChatGPT-CodeReview so PR comments are attributed to the
# App (with its custom name + avatar) instead of "github-actions[bot]" — keeps
# the ChatGPT reviewer visually distinct from the Claude PR reviewer. If the
# mint step fails (bad secret / uninstalled App) the env var falls back to
# secrets.GITHUB_TOKEN so the review still posts.
#
# Required permission:
#   Settings > Actions > General > Workflow permissions > Read and write

on:
  pull_request:
    types: [labeled, opened, reopened]

# One run per PR at a time; do not cancel an in-progress review.
concurrency:
  group: chatgpt-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  chatgpt-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Decide whether to run
        id: gate
        uses: actions/github-script@v9
        with:
          script: |
            const LABEL            = 'chatgpt-review';
            const LINES_THRESHOLD  = 200;
            const FILES_THRESHOLD  = 4;
            const GENERATED        = /^(script\.js|styles\.css|docs\/.+\.html|package-lock\.json)$/;
            const action           = context.payload.action;

            // Path 1 — explicit label event: only run for this specific label.
            if (action === 'labeled') {
              const triggered = context.payload.label.name === LABEL;
              core.info(triggered
                ? 'Triggered by chatgpt-review label — will review.'
                : `Label "${context.payload.label.name}" applied — not chatgpt-review, skipping.`);
              core.setOutput('should_run', String(triggered));
              return;
            }

            // Path 2 — opened / reopened: inline size check (mirrors auto-label-pr.yml).
            // The label from auto-label-pr.yml won't propagate here via GITHUB_TOKEN,
            // so we re-evaluate the thresholds ourselves.
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page:    100,
              }
            );

            const sourceFiles = files.filter(f => !GENERATED.test(f.filename));
            const totalLines  = sourceFiles.reduce((sum, f) => sum + f.additions + f.deletions, 0);
            const fileCount   = sourceFiles.length;

            core.info(`Source files changed: ${fileCount} (threshold ${FILES_THRESHOLD})`);
            core.info(`Source lines changed: ${totalLines} (threshold ${LINES_THRESHOLD})`);

            const meetsThreshold = totalLines >= LINES_THRESHOLD || fileCount >= FILES_THRESHOLD;
            core.info(meetsThreshold
              ? 'Meets size threshold — will review.'
              : 'Below both thresholds — skipping.');
            core.setOutput('should_run', String(meetsThreshold));

      - name: Mint ChatGPT Reviewer App token
        id: chatgpt-token
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CHATGPT_REVIEWER_APP_ID }}
          private-key: ${{ secrets.CHATGPT_REVIEWER_PRIVATE_KEY }}

      - name: Code Review with ChatGPT
        # `always()` keeps the review running even if the mint step failed —
        # the env var falls back to the default workflow token so the review
        # still posts (under github-actions[bot]) rather than being silently
        # skipped because `success()` is false. The mint failure surfaces as
        # a red CI step, which is the signal to fix the secret.
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: anc95/ChatGPT-CodeReview@main
        env:
          # App-installation token; comments post as the "ChatGPT Reviewer"
          # App rather than the generic github-actions[bot]. Falls back to
          # secrets.GITHUB_TOKEN if the mint step failed.
          GITHUB_TOKEN: ${{ steps.chatgpt-token.outputs.token || secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_ENDPOINT: https://api.openai.com/v1
          # o3 reasoning model — deeper analysis than gpt-4o for the kind of
          # subtle bugs surfaced on big PRs (see PR #61 where gpt-4o missed
          # the engines.node mismatch).
          MODEL: o3
          PROMPT: >
            You are reviewing a pull request in a personal time-tracking web
            app (vanilla JavaScript ES modules, SCSS, HTML). The project follows
            the UK Government Analysis Function Higher QA standard. Focus on:
            correctness (logic errors, edge cases, null/undefined), single-purpose
            functions (flag any function doing more than one thing), informative
            naming (flag single-letter variables outside tight map/filter chains),
            error handling (failures must call wlLog.warn or wlLog.error — never
            silent catch), and test coverage (every new exported function needs a
            unit test in test/unit.cjs). Ignore auto-generated files: script.js,
            styles.css, docs/*.html. Be direct and specific; cite file and line
            number for every finding.
          TEMPERATURE: '0.2'
          MAX_TOKENS: '2048'
          top_p: '1'
          MODE: patch
          LANGUAGE: en
