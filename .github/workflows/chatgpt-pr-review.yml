name: ChatGPT PR Review

# Posts an automated ChatGPT code review as a PR comment.
# Uses a direct OpenAI chat-completions API call via actions/github-script,
# replacing the unmaintained anc95/ChatGPT-CodeReview action (Node.js 20,
# silently failed to post reviews).
#
# Triggers two ways:
#   1. 'labeled' event with label == 'chatgpt-review'  — manual labeling
#   2. 'opened' or 'reopened' — size thresholds evaluated inline so the review
#      runs even when the label was applied by auto-label-pr.yml (which uses
#      GITHUB_TOKEN; GitHub suppresses the resulting labeled event for other
#      workflows, so chatgpt-pr-review would never fire without this path).
#
# Size thresholds (matching auto-label-pr.yml):
#   ≥ 200 source-line changes  OR  ≥ 4 source files changed
#   Generated files excluded: script.js, styles.css, docs/*.html, package-lock.json
#
# Required secrets:
#   OPENAI_API_KEY               — OpenAI API key for the ChatGPT review call
#   CHATGPT_REVIEWER_APP_ID      — Client ID of the "ChatGPT Reviewer" GitHub App
#   CHATGPT_REVIEWER_PRIVATE_KEY — .pem private key of the same App
# The GitHub App must be installed on this repo with permissions:
#   Contents: read · Pull requests: write
# An installation token is minted at runtime via actions/create-github-app-token@v3
# so PR comments are attributed to the App (custom name + avatar) instead of
# github-actions[bot]. Falls back to github.token if the mint step fails.
#
# Required permission:
#   Settings > Actions > General > Workflow permissions > Read and write

on:
  pull_request:
    types: [labeled, opened, reopened]

# One run per PR at a time; do not cancel an in-progress review.
concurrency:
  group: chatgpt-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  chatgpt-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Decide whether to run
        id: gate
        uses: actions/github-script@v9
        with:
          script: |
            const LABEL           = 'chatgpt-review';
            const LINES_THRESHOLD = 200;
            const FILES_THRESHOLD = 4;
            const GENERATED       = /^(script\.js|styles\.css|docs\/.+\.html|package-lock\.json)$/;
            const action          = context.payload.action;

            // Path 1 — explicit label event: only run for this specific label.
            if (action === 'labeled') {
              const triggered = context.payload.label.name === LABEL;
              core.info(triggered
                ? 'Triggered by chatgpt-review label — will review.'
                : `Label "${context.payload.label.name}" applied — not chatgpt-review, skipping.`);
              core.setOutput('should_run', String(triggered));
              return;
            }

            // Path 2 — opened / reopened: inline size check (mirrors auto-label-pr.yml).
            // The label from auto-label-pr.yml won't propagate here via GITHUB_TOKEN,
            // so we re-evaluate the thresholds ourselves.
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page:    100,
              }
            );

            const sourceFiles = files.filter(f => !GENERATED.test(f.filename));
            const totalLines  = sourceFiles.reduce((sum, f) => sum + f.additions + f.deletions, 0);
            const fileCount   = sourceFiles.length;

            core.info(`Source files changed: ${fileCount} (threshold ${FILES_THRESHOLD})`);
            core.info(`Source lines changed: ${totalLines} (threshold ${LINES_THRESHOLD})`);

            const meetsThreshold = totalLines >= LINES_THRESHOLD || fileCount >= FILES_THRESHOLD;
            core.info(meetsThreshold
              ? 'Meets size threshold — will review.'
              : 'Below both thresholds — skipping.');
            core.setOutput('should_run', String(meetsThreshold));

      - name: Check out repository
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Write diff
        if: steps.gate.outputs.should_run == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff "$BASE_SHA"..."$HEAD_SHA" \
            -- ':!script.js' ':!styles.css' ':!docs/*.html' ':!package-lock.json' \
            > pr.diff
          echo "Diff size: $(wc -l < pr.diff) lines"

      - name: Mint ChatGPT Reviewer App token
        id: chatgpt-token
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CHATGPT_REVIEWER_APP_ID }}
          private-key: ${{ secrets.CHATGPT_REVIEWER_PRIVATE_KEY }}

      - name: Code Review with ChatGPT
        # `always()` keeps the review running even if the mint step failed —
        # github-token falls back to github.token so the review still posts
        # (under github-actions[bot]) rather than being silently skipped.
        # The red mint-step failure in CI is the signal to fix the secret.
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: actions/github-script@v9
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HEAD_SHA:       ${{ github.event.pull_request.head.sha }}
        with:
          github-token: ${{ steps.chatgpt-token.outputs.token || github.token }}
          script: |
            const fs    = require('fs');
            const https = require('https');

            if (!process.env.OPENAI_API_KEY) {
              core.warning('OPENAI_API_KEY secret is not set — skipping ChatGPT review.');
              return;
            }

            if (!fs.existsSync('pr.diff')) {
              core.warning('pr.diff not found — diff step may have failed. Skipping review.');
              return;
            }
            const diff = fs.readFileSync('pr.diff', 'utf8');
            if (!diff.trim()) {
              core.info('Empty diff after filtering generated files — nothing to review.');
              return;
            }

            // Truncate very large diffs to avoid exceeding the model context window.
            const MAX_DIFF_CHARS = 50000;
            const diffContent = diff.length > MAX_DIFF_CHARS
              ? diff.slice(0, MAX_DIFF_CHARS) + '\n\n[diff truncated]'
              : diff;

            const MODEL  = 'gpt-5.5';
            const PROMPT = [
              'You are reviewing a pull request in a personal time-tracking web app',
              '(vanilla JavaScript ES modules, SCSS, HTML). The project follows the',
              'UK Government Analysis Function Higher QA standard. Focus on:',
              'correctness (logic errors, edge cases, null/undefined),',
              'single-purpose functions (flag any function doing more than one thing),',
              'informative naming (flag single-letter variables outside tight map/filter chains),',
              'error handling (failures must call wlLog.warn or wlLog.error — never silent catch),',
              'and test coverage (every new exported function needs a unit test in test/unit.cjs).',
              'Ignore auto-generated files: script.js, styles.css, docs/*.html.',
              'Be direct and specific; cite file and line number for every finding.',
            ].join(' ');

            const requestBody = JSON.stringify({
              model:            MODEL,
              messages: [
                { role: 'system', content: PROMPT },
                { role: 'user',   content: `Review this diff:\n\n\`\`\`diff\n${diffContent}\n\`\`\`` },
              ],
              max_tokens:       2048,
              // reasoning_effort replaces temperature for reasoning-class models;
              // sending both causes an API error.
              reasoning_effort: 'high',
            });

            const reviewText = await new Promise((resolve, reject) => {
              const req = https.request(
                {
                  hostname: 'api.openai.com',
                  path:     '/v1/chat/completions',
                  method:   'POST',
                  headers:  {
                    'Authorization': `Bearer ${process.env.OPENAI_API_KEY}`,
                    'Content-Type':  'application/json',
                    'Content-Length': Buffer.byteLength(requestBody),
                  },
                },
                (res) => {
                  let raw = '';
                  res.on('data', chunk => { raw += chunk; });
                  res.on('end', () => {
                    let parsed;
                    try {
                      parsed = JSON.parse(raw);
                    } catch (e) {
                      reject(new Error(`Failed to parse OpenAI response: ${raw.slice(0, 200)}`));
                      return;
                    }
                    if (parsed.error) {
                      reject(new Error(`OpenAI API error (${parsed.error.code}): ${parsed.error.message}`));
                      return;
                    }
                    resolve(parsed.choices?.[0]?.message?.content ?? '');
                  });
                }
              );
              req.on('error', reject);
              req.write(requestBody);
              req.end();
            });

            if (!reviewText.trim()) {
              core.warning('OpenAI returned an empty review — skipping comment.');
              return;
            }

            const prNumber = context.payload.pull_request.number;
            const headSha  = process.env.HEAD_SHA;
            const body     = `${reviewText}\n\n---\n*Automated review by ChatGPT \`${MODEL}\` · commit \`${headSha.slice(0, 7)}\`*`;

            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: prNumber,
              body,
            });

            core.info('ChatGPT review posted successfully.');
