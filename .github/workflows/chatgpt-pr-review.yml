name: ChatGPT PR Review

# Three-phase AI review dialogue:
#
#   Phase 1 — chatgpt-review: ChatGPT reads the diff and posts independent
#   inline threads. Claude's own independent review (pr-review.yml) runs in
#   parallel, triggered by the same pull_request event.
#
#   Phase 2 — claude-responds: Claude reads ChatGPT's inline threads, replies
#   to each one with agree/disagree/partial, resolves them, then posts a
#   synthesis comment summarising the overall picture.
#
#   Phase 3 — chatgpt-responds: ChatGPT reads Claude's synthesis and either
#   confirms the resolutions or opens new inline threads for anything Claude
#   missed or got wrong.
#
# Triggers three ways:
#   1. 'labeled' event with label == 'chatgpt-review'  — manual labeling
#   2. 'opened' or 'reopened' — size thresholds evaluated inline
#   3. 'synchronize' (new commits pushed) — re-evaluates size thresholds;
#      re-reviews if still qualifies, skips if the PR has been cleaned up.
#
# Size thresholds (matching auto-label-pr.yml):
#   ≥ 200 source-line changes  OR  ≥ 4 source files changed
#   Generated files excluded: script.js, styles.css, docs/*.html, package-lock.json
#
# Required secrets:
#   OPENAI_API_KEY               — OpenAI API key
#   ANTHROPIC_API_KEY            — Anthropic API key
#   CHATGPT_REVIEWER_APP_ID      — Client ID of the "ChatGPT Reviewer" GitHub App
#   CHATGPT_REVIEWER_PRIVATE_KEY — .pem private key of the same App
#   CLAUDE_REVIEWER_APP_ID       — Client ID of the "Claude Reviewer" GitHub App
#   CLAUDE_REVIEWER_PRIVATE_KEY  — .pem private key of the same App
#
# Required permission:
#   Settings > Actions > General > Workflow permissions > Read and write

on:
  pull_request:
    types: [labeled, opened, reopened, synchronize]

# One full dialogue cycle per PR at a time; do not cancel in-progress runs.
concurrency:
  group: chatgpt-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:

  # ─── Phase 1: ChatGPT independent review ──────────────────────────────────
  chatgpt-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}

    steps:
      - name: Decide whether to run
        id: gate
        uses: actions/github-script@v9
        with:
          script: |
            const LABEL           = 'chatgpt-review';
            const LINES_THRESHOLD = 200;
            const FILES_THRESHOLD = 4;
            const GENERATED       = /^(script\.js|styles\.css|docs\/.+\.html|package-lock\.json)$/;
            const action          = context.payload.action;

            // Path 1 — explicit label event: only run for this specific label.
            if (action === 'labeled') {
              const triggered = context.payload.label.name === LABEL;
              core.info(triggered
                ? 'Triggered by chatgpt-review label — will review.'
                : `Label "${context.payload.label.name}" applied — not chatgpt-review, skipping.`);
              core.setOutput('should_run', String(triggered));
              return;
            }

            // Path 2 — opened / reopened / synchronize: inline size check.
            // synchronize re-evaluates the threshold on every push so that a PR
            // cleaned up below both limits stops getting re-reviewed, and one
            // that grows above them starts being reviewed.
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page:    100,
              }
            );

            const sourceFiles = files.filter(f => !GENERATED.test(f.filename));
            const totalLines  = sourceFiles.reduce((sum, f) => sum + f.additions + f.deletions, 0);
            const fileCount   = sourceFiles.length;

            core.info(`Source files changed: ${fileCount} (threshold ${FILES_THRESHOLD})`);
            core.info(`Source lines changed: ${totalLines} (threshold ${LINES_THRESHOLD})`);

            const meetsThreshold = totalLines >= LINES_THRESHOLD || fileCount >= FILES_THRESHOLD;
            core.info(meetsThreshold
              ? 'Meets size threshold — will review.'
              : 'Below both thresholds — skipping.');
            core.setOutput('should_run', String(meetsThreshold));

      - name: Check out repository
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Write diff
        if: steps.gate.outputs.should_run == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff "$BASE_SHA"..."$HEAD_SHA" \
            -- ':!script.js' ':!styles.css' ':!docs/*.html' ':!package-lock.json' \
            > pr.diff
          echo "Diff size: $(wc -l < pr.diff) lines"

      - name: Mint ChatGPT Reviewer App token
        id: chatgpt-token
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CHATGPT_REVIEWER_APP_ID }}
          private-key: ${{ secrets.CHATGPT_REVIEWER_PRIVATE_KEY }}

      - name: Set up Node.js
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Code Review with ChatGPT
        # `always()` keeps the review running even if the mint step failed —
        # GITHUB_TOKEN falls back to github.token so the review still posts
        # (under github-actions[bot]) rather than being silently skipped.
        if: always() && steps.gate.outputs.should_run == 'true'
        env:
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN:      ${{ steps.chatgpt-token.outputs.token || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER:         ${{ github.event.pull_request.number }}
          HEAD_SHA:          ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/chatgpt-review.mjs

  # ─── Phase 2: Claude responds to ChatGPT's findings ───────────────────────
  claude-responds:
    needs: chatgpt-review
    if: needs.chatgpt-review.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Write filtered diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff "$BASE_SHA"..."$HEAD_SHA" \
            -- ':!script.js' ':!styles.css' ':!docs/*.html' ':!package-lock.json' \
            > pr.diff
          echo "Diff size: $(wc -l < pr.diff) lines"

      - name: Mint Claude Reviewer App token
        id: claude-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CLAUDE_REVIEWER_APP_ID }}
          private-key: ${{ secrets.CLAUDE_REVIEWER_PRIVATE_KEY }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Claude responds to ChatGPT's findings
        # `always()` ensures the script runs even if the token mint step failed;
        # the script falls back to github.token so the synthesis is still posted.
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN:      ${{ steps.claude-token.outputs.token || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER:         ${{ github.event.pull_request.number }}
          HEAD_SHA:          ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/claude-chatgpt-dialogue.mjs

  # ─── Phase 3: ChatGPT responds to Claude's synthesis ──────────────────────
  chatgpt-responds:
    needs: [chatgpt-review, claude-responds]
    if: needs.chatgpt-review.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Write filtered diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff "$BASE_SHA"..."$HEAD_SHA" \
            -- ':!script.js' ':!styles.css' ':!docs/*.html' ':!package-lock.json' \
            > pr.diff
          echo "Diff size: $(wc -l < pr.diff) lines"

      - name: Mint ChatGPT Reviewer App token
        id: chatgpt-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CHATGPT_REVIEWER_APP_ID }}
          private-key: ${{ secrets.CHATGPT_REVIEWER_PRIVATE_KEY }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: ChatGPT responds to Claude's synthesis
        # `always()` ensures the script runs even if the token mint step failed.
        if: always()
        env:
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN:      ${{ steps.chatgpt-token.outputs.token || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER:         ${{ github.event.pull_request.number }}
          HEAD_SHA:          ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/chatgpt-claude-dialogue.mjs
