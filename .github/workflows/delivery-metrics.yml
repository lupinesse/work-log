name: Weekly Delivery Metrics

# Runs every Monday alongside the QA review. Counts issues opened and closed
# in the past 7 days, calculates the Say/Do ratio, and appends a row to
# docs/delivery-metrics.md so delivery consistency is tracked over time.

on:
  schedule:
    - cron: "15 9 * * 1" # Monday 09:15 UTC — 15 min after QA review
  workflow_dispatch: {}

jobs:
  delivery-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Calculate Say/Do ratio
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          WEEK=$(date +%Y-%m-%d)
          SINCE=$(date -d '7 days ago' +%Y-%m-%d)
          REPO=$(gh repo view --json nameWithOwner -q .nameWithOwner)

          # Use GitHub search API for accurate date-filtered counts.
          # per_page=1 + total_count avoids fetching all records.
          # Fall back to 0 on API failure so the row is written with zeros
          # rather than aborting and leaving the metrics file with a gap.
          OPENED=$(gh api \
            "search/issues?q=repo:${REPO}+is:issue+created:>=${SINCE}&per_page=1" \
            --jq '.total_count' 2>/dev/null || echo 0)

          CLOSED=$(gh api \
            "search/issues?q=repo:${REPO}+is:issue+closed:>=${SINCE}&per_page=1" \
            --jq '.total_count' 2>/dev/null || echo 0)

          PRS=$(gh api \
            "search/issues?q=repo:${REPO}+is:pr+is:merged+merged:>=${SINCE}&per_page=1" \
            --jq '.total_count' 2>/dev/null || echo 0)

          if [ "$OPENED" -gt 0 ]; then
            RATIO=$(awk "BEGIN { printf \"%.0f%%\", $CLOSED / $OPENED * 100 }")
          else
            RATIO="—"
          fi

          mkdir -p docs

          if [ ! -f docs/delivery-metrics.md ]; then
            printf '# Delivery Metrics\n\nWeekly Say/Do ratio — issues opened vs closed in the past 7 days.\n\n| Week | Opened | Closed | PRs merged | Say/Do |\n|------|--------|--------|------------|--------|\n' \
              > docs/delivery-metrics.md
          fi

          printf "| %s | %s | %s | %s | %s |\n" \
            "$WEEK" "$OPENED" "$CLOSED" "$PRS" "$RATIO" \
            >> docs/delivery-metrics.md

      - name: Commit metrics
        run: |
          git config user.name "delivery-metrics-bot"
          git config user.email "delivery-metrics-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain docs/delivery-metrics.md)" ]; then
            git add docs/delivery-metrics.md
            git commit -m "Add weekly delivery metrics"
            git push origin HEAD
          else
            echo "No changes to commit."
          fi
