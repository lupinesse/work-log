name: Claude PR Review

# Posts an automated adversarial code review as a PR comment on every push.
# Uses the /pr-review skill, which reads the diff written to pr.diff and
# audits changed files against the project's CLAUDE.md quality standard.
#
# This workflow only runs for PRs *below* the ChatGPT dialogue size threshold
# (< 200 source-line changes AND < 4 source files). For larger PRs, the full
# AI dialogue in chatgpt-pr-review.yml handles Claude's review as a dedicated
# phase — after Claude has already responded to ChatGPT's findings.
#
# Required secrets:
#   ANTHROPIC_API_KEY           — Anthropic API key (or CLAUDE_CODE_OAUTH_TOKEN)
#   CLAUDE_REVIEWER_APP_ID      — App ID of the "Claude Reviewer" GitHub App
#   CLAUDE_REVIEWER_PRIVATE_KEY — .pem private key of the same App
# The GitHub App must be installed on this repo with permissions:
#   Contents: read · Pull requests: write
# An installation token is minted at runtime via actions/create-github-app-token@v3
# and used by `gh pr comment` so the review comment is attributed to the App
# (with its custom name + avatar) instead of "github-actions[bot]" — keeps the
# Claude reviewer visually distinct from the ChatGPT reviewer. If the mint
# step fails (bad secret / uninstalled App) GH_TOKEN falls back to
# github.token so the review still posts.

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read       # checkout
      pull-requests: write # post review comment

    steps:
      - name: Check PR size — skip if dialogue threshold is met
        id: size-gate
        uses: actions/github-script@v9
        with:
          script: |
            const LINES_THRESHOLD = 200;
            const FILES_THRESHOLD = 4;
            const GENERATED       = /^(script\.js|styles\.css|docs\/.+\.html|package-lock\.json)$/;

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page:    100,
              }
            );

            const sourceFiles = files.filter(f => !GENERATED.test(f.filename));
            const totalLines  = sourceFiles.reduce((sum, f) => sum + f.additions + f.deletions, 0);
            const fileCount   = sourceFiles.length;

            const dialogueWillRun = totalLines >= LINES_THRESHOLD || fileCount >= FILES_THRESHOLD;
            if (dialogueWillRun) {
              core.info(`PR meets dialogue threshold (${fileCount} files, ${totalLines} lines) — chatgpt-pr-review.yml handles Claude's review for large PRs.`);
            } else {
              core.info(`PR below dialogue threshold (${fileCount} files, ${totalLines} lines) — running standalone review.`);
            }
            core.setOutput('should_run', String(!dialogueWillRun));

      - name: Check out repository
        if: steps.size-gate.outputs.should_run == 'true'
        uses: actions/checkout@v6
        with:
          # Full history so git diff can compare against the base branch
          fetch-depth: 0

      - name: Set up Node.js
        if: steps.size-gate.outputs.should_run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Claude Code
        if: steps.size-gate.outputs.should_run == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Write diff to pr.diff
        if: steps.size-gate.outputs.should_run == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff "$BASE_SHA"..."$HEAD_SHA" > pr.diff
          echo "Diff size: $(wc -l < pr.diff) lines"

      - name: Check auth is present
        id: key-check
        if: steps.size-gate.outputs.should_run == 'true'
        env:
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH_TOKEN" ] || [ -n "$API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is set — skipping automated review."
          fi

      - name: Run PR review
        if: steps.key-check.outputs.present == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "/pr-review" \
            --model claude-opus-4-8 \
            --allowedTools "Read" "Grep" "Glob" \
                           "Bash(git log:*)" "Bash(git diff:*)" \
                           "Bash(git show:*)" "Bash(cat:*)" "Bash(wc:*)" \
            > review-output.txt 2>&1
          echo "Review complete ($(wc -l < review-output.txt) lines)"

      - name: Mint Claude Reviewer App token
        id: claude-token
        if: always() && steps.key-check.result != 'skipped'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CLAUDE_REVIEWER_APP_ID }}
          private-key: ${{ secrets.CLAUDE_REVIEWER_PRIVATE_KEY }}

      - name: Post review as PR comment
        if: always() && steps.key-check.result != 'skipped'
        env:
          # App-installation token; comment posts as the "Claude Reviewer" App
          # rather than the generic github-actions[bot]. Falls back to the
          # automatic workflow token if the mint step failed (bad secret /
          # uninstalled App) so the review comment still gets posted — the
          # red mint-step failure in CI is the signal to fix the secret.
          GH_TOKEN: ${{ steps.claude-token.outputs.token || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -f review-output.txt ]; then
            {
              cat review-output.txt
              echo ""
              echo "---"
              echo "*Automated review by [Claude Code](https://claude.ai/claude-code) \`/pr-review\` · commit \`${HEAD_SHA::7}\`*"
            } > comment-body.txt
          else
            echo "> ⚠️ Automated review skipped — \`ANTHROPIC_API_KEY\` secret is not set. Add it in **Settings → Secrets and variables → Actions** to enable AI code review." > comment-body.txt
          fi

          gh pr comment "$PR_NUMBER" --body-file comment-body.txt
