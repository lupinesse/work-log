name: Claude PR Review

# Posts an automated adversarial code review as a PR comment on every push.
# Uses the /pr-review skill, which reads the diff written to pr.diff and
# audits changed files against the project's CLAUDE.md quality standard.
#
# This workflow only runs for PRs *below* the ChatGPT dialogue size threshold
# (< 200 source-line changes AND < 4 source files). For larger PRs, the full
# AI dialogue in chatgpt-pr-review.yml handles Claude's review as a dedicated
# phase — after Claude has already responded to ChatGPT's findings.
#
# Required secrets:
#   CLAUDE_CODE_OAUTH_TOKEN     — Claude subscription token (`claude setup-token`)
#   CLAUDE_REVIEWER_APP_ID      — App ID of the "Claude Reviewer" GitHub App
#   CLAUDE_REVIEWER_PRIVATE_KEY — .pem private key of the same App
# The GitHub App must be installed on this repo with permissions:
#   Contents: read · Pull requests: write
# An installation token is minted at runtime via actions/create-github-app-token (pinned below)
# and used by `gh pr comment` so the review comment is attributed to the App
# (with its custom name + avatar) instead of "github-actions[bot]" — keeps the
# Claude reviewer visually distinct from the ChatGPT reviewer. If the mint
# step fails (bad secret / uninstalled App) GH_TOKEN falls back to
# github.token so the review still posts.

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read       # checkout
      pull-requests: write # post review comment

    steps:
      - name: Check out scripts (shared size-gate module)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Check PR size — skip if dialogue threshold is met
        id: size-gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { classifyPR, LINES_THRESHOLD, FILES_THRESHOLD } =
              await import(`file://${process.env.GITHUB_WORKSPACE}/.github/scripts/lib/pr-size-gate.mjs`);

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page:    100,
              }
            );

            const { totalLines, fileCount, isDocsOnly } = classifyPR(files);

            if (isDocsOnly) {
              core.info(`PR only changes documentation (${fileCount} file(s)) — skipping review.`);
              core.setOutput('should_run', 'false');
              return;
            }

            const dialogueWillRun = totalLines >= LINES_THRESHOLD || fileCount >= FILES_THRESHOLD;
            if (dialogueWillRun) {
              core.info(`PR meets dialogue threshold (${fileCount} files, ${totalLines} lines) — chatgpt-pr-review.yml handles Claude's review for large PRs.`);
            } else {
              core.info(`PR below dialogue threshold (${fileCount} files, ${totalLines} lines) — running standalone review.`);
            }
            core.setOutput('should_run', String(!dialogueWillRun));

      - name: Check out repository
        if: steps.size-gate.outputs.should_run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so git diff can compare against the base branch
          fetch-depth: 0

      - name: Set up Node.js
        if: steps.size-gate.outputs.should_run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install Claude Code
        if: steps.size-gate.outputs.should_run == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Write diff to pr.diff
        if: steps.size-gate.outputs.should_run == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff "$BASE_SHA"..."$HEAD_SHA" > pr.diff
          echo "Diff size: $(wc -l < pr.diff) lines"

      - name: Check auth is present
        id: key-check
        if: steps.size-gate.outputs.should_run == 'true'
        env:
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Mapped into env because the `secrets` context is not available in
          # step `if:` conditions — only `env`/`steps` outputs are. The mint
          # step below guards on the `app` output this emits.
          APP_ID: ${{ secrets.CLAUDE_REVIEWER_APP_ID }}
        run: |
          if [ -n "$OAUTH_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN is not set — skipping automated review."
          fi
          if [ -n "$APP_ID" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLAUDE_REVIEWER_APP_ID is not set — review comment will post as github-actions[bot]."
          fi

      - name: Run PR review
        if: steps.key-check.outputs.present == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "/pr-review" \
            --model claude-sonnet-4-6 \
            --max-turns 20 \
            --output-format json \
            --allowedTools "Grep" "Bash(git log:*)" "Bash(git diff:*)" \
                           "Bash(git show:*)" "Bash(cat:*)" "Bash(wc:*)" \
            > review-raw.json 2>review-stderr.txt || true
          [ -s review-stderr.txt ] && echo "--- claude stderr ---" && cat review-stderr.txt
          if jq -e '.result' review-raw.json > /dev/null 2>&1; then
            jq -r '.result' review-raw.json > review-output.txt
            jq -r '"Phase 3 stats: turns=\(.num_turns // "?") cost=$\(.total_cost_usd // "?") duration=\(.duration_ms // "?")ms"' \
              review-raw.json
          else
            cat review-raw.json review-stderr.txt > review-output.txt 2>/dev/null || true
          fi
          echo "Review complete ($(wc -l < review-output.txt) lines)"

      - name: Mint Claude Reviewer App token
        id: claude-token
        # Skip when the reviewer App isn't configured — minting with an empty
        # client-id hard-errors and fails the whole job. Guarded on the
        # key-check `app` output (not `secrets` directly, which is unavailable
        # in `if:`). The comment step below falls back to the workflow token,
        # so the review still posts (as github-actions[bot]).
        if: always() && steps.key-check.conclusion != 'skipped' && steps.key-check.outputs.app == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CLAUDE_REVIEWER_APP_ID }}
          private-key: ${{ secrets.CLAUDE_REVIEWER_PRIVATE_KEY }}

      - name: Post or update review as PR comment
        # Updates the previous /pr-review comment in place (matched by marker)
        # rather than stacking a new one per push. Keeps the PR thread clean.
        if: always() && steps.key-check.conclusion != 'skipped'
        env:
          # App-installation token; comment posts as the "Claude Reviewer" App
          # rather than the generic github-actions[bot]. Falls back to the
          # automatic workflow token when the mint step is skipped (no
          # CLAUDE_REVIEWER_APP_ID configured) or fails (bad secret /
          # uninstalled App), so the review comment still gets posted.
          GH_TOKEN: ${{ steps.claude-token.outputs.token || github.token }}
          # GH_REPO bypasses gh's git-based repo detection. Defence in depth:
          # if the checkout step failed (this step runs under always()), gh
          # would otherwise call `git rev-parse` in a non-repo directory.
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          MARKER='<!-- claude-pr-review-comment -->'
          if [ -f review-output.txt ]; then
            {
              echo "$MARKER"
              cat review-output.txt
              echo ""
              echo "---"
              echo "*Automated review by [Claude Code](https://claude.ai/claude-code) \`/pr-review\` · commit \`${HEAD_SHA::7}\`*"
            } > comment-body.txt
          else
            {
              echo "$MARKER"
              echo "> ⚠️ Automated review skipped — \`CLAUDE_CODE_OAUTH_TOKEN\` is not set. Add it in **Settings → Secrets and variables → Actions** to enable AI code review."
            } > comment-body.txt
          fi

          PREV_ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"$MARKER\"))] | last | .id // empty")

          if [ -n "$PREV_ID" ]; then
            echo "Updating existing comment $PREV_ID"
            gh api "repos/$REPO/issues/comments/$PREV_ID" \
              --method PATCH \
              --field body=@comment-body.txt
          else
            echo "Posting new comment (no previous found)"
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
              --method POST \
              --field body=@comment-body.txt
          fi
