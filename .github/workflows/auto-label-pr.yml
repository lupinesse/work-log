name: Auto-label large PRs

# Applies the 'chatgpt-review' label when a PR crosses either threshold:
#   - ≥ 200 source-line changes (additions + deletions, generated files excluded)
#   - ≥ 4 source files changed (generated files excluded)
#
# Generated files excluded from the count: script.js, styles.css,
# docs/*.html, package-lock.json
#
# Required permission:
#   Settings > Actions > General > Workflow permissions > Read and write

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  auto-label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out scripts (shared size-gate module)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Apply chatgpt-review label to large PRs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { classifyPR, LABEL, LINES_THRESHOLD, FILES_THRESHOLD } =
              await import(`file://${process.env.GITHUB_WORKSPACE}/.github/scripts/lib/pr-size-gate.mjs`);

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              }
            );

            const { totalLines, fileCount, meetsThreshold } = classifyPR(files);

            core.info(`Source files changed: ${fileCount} (threshold ${FILES_THRESHOLD})`);
            core.info(`Source lines changed: ${totalLines} (threshold ${LINES_THRESHOLD})`);

            if (!meetsThreshold) {
              core.info('Below both thresholds — skipping label.');
              return;
            }

            const existingLabels = context.payload.pull_request.labels.map(l => l.name);
            if (existingLabels.includes(LABEL)) {
              core.info(`Label "${LABEL}" already present — nothing to do.`);
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: [LABEL],
            });

            core.info(`Applied "${LABEL}" — PR qualifies (${fileCount} files, ${totalLines} lines).`);
