name: SCSS Architecture Audit

# Runs the /scss-audit skill on every PR push that touches SCSS files and
# posts a report of BEM violations, excessive nesting, !important usage,
# magic numbers, and undeclared variables.
#
# Required secrets:
#   CLAUDE_CODE_OAUTH_TOKEN     — Claude subscription token; the preferred credential
#   ANTHROPIC_API_KEY           — Anthropic API key; used only when the OAuth token is absent
#   CLAUDE_REVIEWER_APP_ID      — App ID of the "Claude Reviewer" GitHub App
#   CLAUDE_REVIEWER_PRIVATE_KEY — .pem private key of the same App

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/css/**"

jobs:
  scss-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Write diff to pr.diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff "$BASE_SHA"..."$HEAD_SHA" > pr.diff
          echo "Diff size: $(wc -l < pr.diff) lines"

      - name: Check auth is present
        id: key-check
        env:
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH_TOKEN" ] || [ -n "$API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is set — skipping SCSS audit."
          fi

      - name: Run SCSS audit
        id: scss-run
        if: steps.key-check.outputs.present == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY:       ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Prefer the OAuth subscription token; fall back to the API key.
          # The reverse order used to be in force here, which silently routed
          # every run through a pay-as-you-go account that had exhausted its
          # credit — the CLI exited 1 with "Credit balance is too low" while a
          # perfectly good OAuth token sat unused. pr-review.yml never
          # referenced ANTHROPIC_API_KEY and kept working throughout, which is
          # what isolated the cause. The header comment above always documented
          # this order; only the code disagreed.
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            unset ANTHROPIC_API_KEY
            echo "Auth: CLAUDE_CODE_OAUTH_TOKEN (subscription)"
          else
            echo "Auth: ANTHROPIC_API_KEY (pay-as-you-go)"
          fi

          # The report is captured to a file because the comment step below
          # posts it verbatim. Capture the exit status explicitly rather than
          # letting `bash -e` abort here: on a non-zero exit that abort skipped
          # every later step, so the CLI's only diagnostic stayed sealed in an
          # unread file and the job reported a bare "exit code 1". That is how
          # this breakage went unnoticed for six days.
          set +e
          claude -p "/scss-audit" \
            --model claude-sonnet-4-6 \
            --allowedTools "Read" "Grep" "Glob" \
                           "Bash(cat:*)" "Bash(wc:*)" \
            > scss-output.txt 2>&1
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo "::group::claude CLI output (exit $status)"
            if [ -s scss-output.txt ]; then
              cat scss-output.txt
            else
              echo "(the CLI wrote nothing to stdout or stderr — it most likely failed to start at all)"
            fi
            echo "::endgroup::"
            echo "::error::claude CLI exited $status — expand the 'claude CLI output' group above, or download the scss-audit-output artifact."
            exit "$status"
          fi
          echo "SCSS audit complete ($(wc -l < scss-output.txt) lines)"

      # Belt and braces: the log group above is enough for a short error, but a
      # long report gets truncated in the web log view. The artifact keeps the
      # untruncated output on both the success and failure paths.
      - name: Upload raw CLI output
        if: always() && steps.scss-run.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: scss-audit-output
          path: scss-output.txt
          if-no-files-found: warn

      - name: Mint Claude Reviewer App token
        id: claude-token
        if: steps.key-check.outputs.present == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CLAUDE_REVIEWER_APP_ID }}
          private-key: ${{ secrets.CLAUDE_REVIEWER_PRIVATE_KEY }}

      - name: Post or update SCSS report as PR comment
        if: steps.key-check.outputs.present == 'true'
        env:
          GH_TOKEN:   ${{ steps.claude-token.outputs.token || github.token }}
          GH_REPO:    ${{ github.repository }}
          PR_NUMBER:  ${{ github.event.pull_request.number }}
          HEAD_SHA:   ${{ github.event.pull_request.head.sha }}
          REPO:       ${{ github.repository }}
        run: |
          MARKER='<!-- claude-scss-audit-comment -->'
          if [ -f scss-output.txt ]; then
            {
              echo "$MARKER"
              cat scss-output.txt
              echo ""
              echo "---"
              echo "*Automated audit by [Claude Code](https://claude.ai/claude-code) \`/scss-audit\` · commit \`${HEAD_SHA::7}\`*"
            } > comment-body.txt
          else
            {
              echo "$MARKER"
              echo "> ⚠️ SCSS audit skipped — no API credentials configured."
            } > comment-body.txt
          fi

          PREV_ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"$MARKER\"))] | last | .id // empty")

          if [ -n "$PREV_ID" ]; then
            echo "Updating existing comment $PREV_ID"
            gh api "repos/$REPO/issues/comments/$PREV_ID" \
              --method PATCH \
              --field body=@comment-body.txt
          else
            echo "Posting new comment"
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
              --method POST \
              --field body=@comment-body.txt
          fi
