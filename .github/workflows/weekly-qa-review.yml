name: QA Review

# Runs the /qa-review skill on demand and commits the dated report
# to docs/qa-reports/ so quality is tracked over time.

on:
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  qa-review:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # needed to commit the report back to the repo
      pull-requests: write # needed to open the report PR
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run QA review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "/qa-review" \
            --allowedTools "Read" "Grep" "Glob" "Write" \
                           "Bash(git log:*)" "Bash(git branch:*)" \
                           "Bash(git tag:*)" "Bash(git status:*)" \
                           "Bash(git remote:*)" "Bash(git rev-parse:*)" \
                           "Bash(ls:*)" "Bash(find:*)" "Bash(cat:*)" \
                           "Bash(head:*)" "Bash(test:*)" "Bash(wc:*)"

      - name: Commit the report and open a PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "qa-review-bot"
          git config user.email "qa-review-bot@users.noreply.github.com"
          if [ -z "$(git status --porcelain docs/qa-reports/)" ]; then
            echo "No new report to commit."
            exit 0
          fi

          # main is protected — a required-status-check push here is always
          # rejected (GH013), so land the report via a branch + PR instead.
          DATE=$(date +%Y-%m-%d)
          BRANCH="claude/qa-review-$DATE"
          git checkout -B "$BRANCH"
          git add docs/qa-reports/
          git commit -m "docs: weekly QA report $DATE"
          git push -f origin "$BRANCH"

          if gh pr list --head "$BRANCH" --state open --json number \
               | node .github/scripts/check-pr-exists.mjs; then
            echo "PR already open for $BRANCH — nothing further to do."
          else
            gh pr create \
              --title "Weekly QA report $DATE" \
              --body "Automated weekly QA review. See \`docs/qa-reports/qa-review-$DATE.md\`." \
              --base main --head "$BRANCH" --draft
          fi

          # A newer report supersedes older report PRs (see the "QA report
          # lifecycle" section of .claude/skills/qa-review/SKILL.md). Selection
          # is by branch prefix in a tested script, never by title search.
          gh pr list --state open --limit 100 --json number,headRefName \
            | node .github/scripts/list-superseded-qa-prs.mjs "$BRANCH" \
            | while read -r PR_NUMBER; do
                echo "Closing PR $PR_NUMBER as superseded by $BRANCH"
                gh pr close "$PR_NUMBER" \
                  --comment "Superseded by newer weekly QA report: \`$BRANCH\`."
              done
