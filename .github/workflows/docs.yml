name: Docs

# Generates JSDoc from src/js/ and pushes to the gh-pages branch,
# which GitHub Pages serves at https://lupinesse.github.io/work-log/
#
# One-time setup: Settings → Pages → Branch: gh-pages / (root)
# (Done automatically after the first successful run.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # needed to push the gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (keeps script.js in sync for JSDoc)
        run: node build.js

      - name: Generate JSDoc
        run: npm run docs

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'docs: update JSDoc reference'
