name: Docs

# Generates JSDoc from src/js/ and publishes to GitHub Pages.
# Pages URL: https://<owner>.github.io/<repo>/
#
# One-time setup required in the repo settings:
#   Settings → Pages → Source → GitHub Actions

on:
  push:
    branches: [main]
  # Allow triggering manually from the Actions tab
  workflow_dispatch:

# Grant the GITHUB_TOKEN the permissions needed to publish Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy runs at a time; skip queued runs but keep in-progress ones
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (ensures script.js is up to date for JSDoc)
        run: node build.js

      - name: Generate JSDoc
        run: npm run docs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    needs: build-docs
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
