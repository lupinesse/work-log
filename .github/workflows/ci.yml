name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Smoke tests
        run: npm test

  scripts-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Script unit tests
        run: npm run test:scripts

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The commit-msg hook only ever runs on contributors' machines, so a
      # dependency skew that breaks commitlint is otherwise invisible until
      # someone's next clean checkout (see QA 2026-08-03, priority 3).
      - name: Commitlint self-test (dependency-skew guard)
        run: npm run test:commitlint

      # Pinned to an exact release and checksum-verified before it runs: this
      # binary lints the files that decide what CI does, so an unpinned or
      # unverified download would be a poor trade.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "$archive" -C "${RUNNER_TEMP}/bin" actionlint
          rm "$archive"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      # An invalid key in a workflow file does not fail loudly — GitHub refuses
      # to parse it, schedules zero jobs, and reports nothing. That has broken
      # this repo twice (PR #256, PR #299), both times found by hand days later.
      # Also re-checks that actionlint still catches both, so this can't rot
      # into a green check that proves nothing (see issue #307).
      - name: Workflow lint + self-test (silent-CI-breakage guard)
        run: npm run test:actionlint

      # Two PRs documenting the same change insert their bullets at different
      # line offsets, so git merges both without a conflict and the duplicate
      # only shows up when someone reads the file. That happened on 2026-08-14
      # (#331 and #332 both documented #326) and took a third PR to undo.
      - name: CHANGELOG duplicate-entry check
        run: npm run test:changelog

      - name: Docs (fail on JSDoc parse errors)
        run: npm run docs
