name: JSDoc Coverage Check

# Runs .github/scripts/jsdoc-check.mjs on every PR push and posts a report of
# exported functions missing JSDoc or missing @param/@returns tags.
# Enforces the CLAUDE.md requirement that every exported function is documented.
#
# No Claude API credentials required — this is pure static analysis.
#
# Required secrets (only for posting the comment):
#   CLAUDE_REVIEWER_APP_ID      — App ID of the "Claude Reviewer" GitHub App
#   CLAUDE_REVIEWER_PRIVATE_KEY — .pem private key of the same App

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/js/**"

jobs:
  jsdoc-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Write diff to pr.diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff "$BASE_SHA"..."$HEAD_SHA" > pr.diff
          echo "Diff size: $(wc -l < pr.diff) lines"

      - name: Run JSDoc check
        run: node .github/scripts/jsdoc-check.mjs > jsdoc-output.txt
        # Script always exits 0; verdict is embedded in stdout.

      - name: Mint Claude Reviewer App token
        id: claude-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CLAUDE_REVIEWER_APP_ID }}
          private-key: ${{ secrets.CLAUDE_REVIEWER_PRIVATE_KEY }}

      - name: Post or update JSDoc report as PR comment
        env:
          GH_TOKEN:  ${{ steps.claude-token.outputs.token || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA:  ${{ github.event.pull_request.head.sha }}
          REPO:      ${{ github.repository }}
        run: |
          MARKER='<!-- claude-jsdoc-check-comment -->'
          {
            echo "$MARKER"
            cat jsdoc-output.txt
            echo ""
            echo "---"
            echo "*Automated check · commit \`${HEAD_SHA::7}\`*"
          } > comment-body.txt

          PREV_ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"$MARKER\"))] | last | .id // empty")

          if [ -n "$PREV_ID" ]; then
            echo "Updating existing comment $PREV_ID"
            gh api "repos/$REPO/issues/comments/$PREV_ID" \
              --method PATCH \
              --field body=@comment-body.txt
          else
            echo "Posting new comment"
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
              --method POST \
              --field body=@comment-body.txt
          fi
