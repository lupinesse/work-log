name: Accessibility Audit

# Runs pa11y (WCAG 2.1 AA) on every PR that touches HTML, JS, or CSS, and
# posts a structured violation report as a PR comment. No API key required.
#
# Required secrets: none (uses the built-in GITHUB_TOKEN for PR comments).
# Optional secrets:
#   CLAUDE_REVIEWER_APP_ID      — GitHub App ID for a named-bot commenter
#   CLAUDE_REVIEWER_PRIVATE_KEY — .pem private key for the same App
#   (If absent, comments are posted by the github-actions[bot] identity.)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/js/**"
      - "src/css/**"
      - "src/**/*.html"
      - "work-log.html"

jobs:
  a11y-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install pa11y
        run: npm install -g pa11y

      - name: Start preview server
        run: npx vite preview &

      - name: Wait for server
        run: npx wait-on http://localhost:8090/work-log.html --timeout 30000

      # pa11y exits 1 when violations are found (still valid JSON) and 2 on
      # a technical error. continue-on-error lets us always reach the report
      # and comment steps regardless of exit code.
      - name: Run pa11y WCAG 2.1 AA audit
        continue-on-error: true
        run: |
          pa11y http://localhost:8090/work-log.html \
            --standard WCAG2AA \
            --reporter json \
            --timeout 30000 \
            > pa11y-raw.json

      - name: Format audit report
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/format-a11y-report.mjs

      - name: Mint Claude Reviewer App token
        id: claude-token
        if: secrets.CLAUDE_REVIEWER_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CLAUDE_REVIEWER_APP_ID }}
          private-key: ${{ secrets.CLAUDE_REVIEWER_PRIVATE_KEY }}

      - name: Post or update accessibility report as PR comment
        env:
          GH_TOKEN:   ${{ steps.claude-token.outputs.token || github.token }}
          PR_NUMBER:  ${{ github.event.pull_request.number }}
          REPO:       ${{ github.repository }}
        run: |
          MARKER='<!-- claude-a11y-audit-comment -->'
          PREV_ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"$MARKER\"))] | last | .id // empty")
          if [ -n "$PREV_ID" ]; then
            echo "Updating existing comment $PREV_ID"
            gh api "repos/$REPO/issues/comments/$PREV_ID" \
              --method PATCH \
              --field body=@comment-body.txt
          else
            echo "Posting new comment"
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
              --method POST \
              --field body=@comment-body.txt
          fi
