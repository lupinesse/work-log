name: Accessibility Audit

# Runs the /a11y-audit skill (a targeted static analysis pass, not a live
# page scan) against the PR's diff and posts a structured violation report
# as a PR comment.
#
# Scoping is owned entirely by the skill (.claude/skills/a11y-audit/SKILL.md):
# it reads pr.diff, scans only the .html/.js/.scss files actually touched by
# the PR, and posts "no auditable files in scope" when the diff touches none
# of those — so a PR that only changes e.g. a pure JS helper with no DOM
# impact does not get flooded with pre-existing, unrelated site-wide findings.
# (#328 — the previous pa11y-based version scanned the whole rendered page on
# every PR regardless of what changed.)
#
# Required secrets:
#   CLAUDE_CODE_OAUTH_TOKEN     — Claude subscription token (`claude setup-token`)
# Optional secrets:
#   CLAUDE_REVIEWER_APP_ID      — GitHub App ID for a named-bot commenter
#   CLAUDE_REVIEWER_PRIVATE_KEY — .pem private key for the same App
#   (If absent, comments are posted by the github-actions[bot] identity.)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/js/**"
      - "src/css/**"
      - "src/**/*.html"
      - "work-log.html"

jobs:
  a11y-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history so git diff can compare against the base branch
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Write diff to pr.diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff "$BASE_SHA"..."$HEAD_SHA" > pr.diff
          echo "Diff size: $(wc -l < pr.diff) lines"

      # The `secrets` context is not available in step `if:` conditions, so
      # map the token through `env` here and guard the run step on this
      # output. Referencing `secrets` directly in `if:` makes the whole
      # workflow file invalid (it fails to start any jobs).
      - name: Check auth is present
        id: key-check
        env:
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APP_ID: ${{ secrets.CLAUDE_REVIEWER_APP_ID }}
        run: |
          if [ -n "$OAUTH_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN is not set — skipping accessibility audit."
          fi
          if [ -n "$APP_ID" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLAUDE_REVIEWER_APP_ID is not set — comment will post as github-actions[bot]."
          fi

      - name: Run accessibility audit
        if: steps.key-check.outputs.present == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "/a11y-audit" \
            --model claude-sonnet-4-6 \
            --max-turns 20 \
            --output-format json \
            --allowedTools "Read" "Grep" "Glob" "Bash(cat:*)" "Bash(wc:*)" \
            > audit-raw.json 2>audit-stderr.txt || true
          [ -s audit-stderr.txt ] && echo "--- claude stderr ---" && cat audit-stderr.txt
          if jq -e '.result' audit-raw.json > /dev/null 2>&1; then
            jq -r '.result' audit-raw.json > audit-output.txt
            jq -r '"a11y-audit stats: turns=\(.num_turns // "?") cost=$\(.total_cost_usd // "?") duration=\(.duration_ms // "?")ms"' \
              audit-raw.json
          else
            cat audit-raw.json audit-stderr.txt > audit-output.txt 2>/dev/null || true
          fi
          echo "Audit complete ($(wc -l < audit-output.txt) lines)"

      - name: Mint Claude Reviewer App token
        id: claude-token
        if: always() && steps.key-check.conclusion != 'skipped' && steps.key-check.outputs.app == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CLAUDE_REVIEWER_APP_ID }}
          private-key: ${{ secrets.CLAUDE_REVIEWER_PRIVATE_KEY }}

      - name: Post or update accessibility report as PR comment
        # Updates the previous audit comment in place (matched by marker)
        # rather than stacking a new one per push. Keeps the PR thread clean.
        if: always() && steps.key-check.conclusion != 'skipped'
        env:
          GH_TOKEN:  ${{ steps.claude-token.outputs.token || github.token }}
          GH_REPO:   ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA:  ${{ github.event.pull_request.head.sha }}
          REPO:      ${{ github.repository }}
        run: |
          MARKER='<!-- claude-a11y-audit-comment -->'
          if [ -f audit-output.txt ]; then
            {
              echo "$MARKER"
              cat audit-output.txt
              echo ""
              echo "---"
              echo "*Automated audit by [Claude Code](https://claude.ai/claude-code) \`/a11y-audit\` · commit \`${HEAD_SHA::7}\`*"
            } > comment-body.txt
          else
            {
              echo "$MARKER"
              echo "## Accessibility Audit (WCAG 2.1 AA)"
              echo ""
              echo "> ⚠️ Automated audit skipped — \`CLAUDE_CODE_OAUTH_TOKEN\` is not set. Add it in **Settings → Secrets and variables → Actions** to enable the accessibility audit."
            } > comment-body.txt
          fi

          PREV_ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"$MARKER\"))] | last | .id // empty")

          if [ -n "$PREV_ID" ]; then
            echo "Updating existing comment $PREV_ID"
            gh api "repos/$REPO/issues/comments/$PREV_ID" \
              --method PATCH \
              --field body=@comment-body.txt
          else
            echo "Posting new comment (no previous found)"
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
              --method POST \
              --field body=@comment-body.txt
          fi
