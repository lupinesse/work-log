name: GitHub Release

# Publishes a GitHub Release whenever a version tag is pushed.
# The release body is extracted from the matching section in CHANGELOG.md.
#
# Usage:
#   git tag v1.8.0 && git push origin v1.8.0
#
# CHANGELOG.md follows the Keep a Changelog heading format, e.g.
# "## [1.8.0] — 2026-05-01" (see the v1.9.0 consolidation, #216) — the tag's
# "v" prefix is stripped before matching against the bracketed version.

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to create a GitHub Release

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # needed so the full CHANGELOG history is available

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"   # e.g. v1.9.1
          VERSION="${TAG#v}"        # e.g. 1.9.1
          PREFIX="## [${VERSION}]" # matches "## [1.9.1] — 2026-08-03"

          # Pull the block that starts at the "## [<VERSION>] — ..." heading
          # and ends at the next "## " heading or a "---" horizontal rule,
          # whichever comes first. index() is a plain substring check, so no
          # version digit/dot needs regex-escaping.
          awk -v prefix="$PREFIX" '
            index($0, prefix) == 1 { found=1; next }
            found && /^---$/ { exit }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          # Trim leading/trailing blank lines
          sed -i '/./,$!d' release-notes.md
          sed -i -e :a -e '/^\s*$/{$d;N;ba}' release-notes.md

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Append config defaults to release notes
        run: node scripts/config-snapshot.cjs >> release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.notes.outputs.tag }}" \
            --title "${{ steps.notes.outputs.tag }}" \
            --notes-file release-notes.md \
            --verify-tag
