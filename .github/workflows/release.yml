name: GitHub Release

# Publishes a GitHub Release whenever a version tag is pushed.
# The release body is extracted from the matching section in CHANGELOG.md.
#
# Usage:
#   git tag v1.8.0 && git push origin v1.8.0
#
# CHANGELOG.md follows the Keep a Changelog heading format, e.g.
# "## [1.8.0] — 2026-05-01" (see the v1.9.0 consolidation, #216) — the tag's
# "v" prefix is stripped before matching against the bracketed version.
#
# Can also be re-run manually (Actions tab -> Run workflow) against an
# existing tag to re-sync its release notes with the current CHANGELOG.md —
# e.g. after a post-publish correction like #332/#340. The "Create or update
# GitHub Release" step below edits the existing release in place rather than
# erroring, since --verify-tag alone can't overwrite one that already exists.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to re-sync release notes for, e.g. v1.9.2'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to create/edit a GitHub Release

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0  # needed so the full CHANGELOG history is available

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          TAG_INPUT: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          TAG="$TAG_INPUT" # e.g. vX.Y.Z
          node .github/scripts/render-release-notes.mjs "$TAG" > release-notes.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Append config defaults to release notes
        run: node scripts/config-snapshot.cjs >> release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_OUTPUT: ${{ steps.notes.outputs.tag }}
        run: |
          TAG="$TAG_OUTPUT"
          if gh release view "$TAG" --json id >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --verify-tag
          fi
