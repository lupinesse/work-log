name: GitHub Release

# Publishes a GitHub Release whenever a version tag is pushed, with the body
# taken from the matching "## [X.Y.Z]" section of CHANGELOG.md (the tag's "v"
# prefix is stripped; the tag must look like v1.2.3 or the run fails early).
#
# Re-run it by hand (Actions tab -> Run workflow) to re-sync an existing
# release's notes after a CHANGELOG correction. Dispatch it from the branch
# that holds the correction: checkout reads the selected branch, not the tag,
# and the "tag" input only picks the section and which release to edit.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to re-sync release notes for; must start with v, e.g. v1.9.2'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to create/edit a GitHub Release

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # needed so the full CHANGELOG history is available

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          TAG_INPUT: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          TAG="$TAG_INPUT" # e.g. vX.Y.Z
          node .github/scripts/render-release-notes.mjs "$TAG" > release-notes.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Append config defaults to release notes
        run: node scripts/config-snapshot.cjs >> release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_OUTPUT: ${{ steps.notes.outputs.tag }}
        run: |
          TAG="$TAG_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --verify-tag
          fi
