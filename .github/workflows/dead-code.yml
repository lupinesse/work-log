name: Dead Code Detection

# Runs the /dead-code skill on a weekly schedule and on manual dispatch.
# Maps all exports in src/js/ against all import sites to find symbols
# that are never consumed. Commits the dated report to docs/dead-code-reports/.
#
# Required secrets:
#   CLAUDE_CODE_OAUTH_TOKEN — Claude subscription token; the preferred credential
#   ANTHROPIC_API_KEY       — Anthropic API key; used only when the OAuth token is absent

on:
  schedule:
    # 09:30 UTC every Monday — runs after weekly-qa-review.yml (09:00 UTC)
    - cron: "30 9 * * 1"
  workflow_dispatch: {}

jobs:
  dead-code:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Check auth is present
        id: key-check
        env:
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH_TOKEN" ] || [ -n "$API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is set — skipping dead code detection."
          fi

      - name: Run dead code detection
        id: dead-code-run
        if: steps.key-check.outputs.present == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY:       ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Prefer the OAuth subscription token; fall back to the API key. See
          # scss-audit.yml for the full account — in short, the reverse order
          # forced every run onto an API key with no credit left, and the CLI
          # exited 1 with "Credit balance is too low".
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            unset ANTHROPIC_API_KEY
            echo "Auth: CLAUDE_CODE_OAUTH_TOKEN (subscription)"
          else
            echo "Auth: ANTHROPIC_API_KEY (pay-as-you-go)"
          fi

          # Unlike scss-audit.yml, this skill writes its report to
          # docs/dead-code-reports/ and uses stdout only for progress, so tee is
          # the better fit: the output stays visible in the step log while still
          # being captured for the artifact. PIPESTATUS[0] is the CLI's exit
          # code — a plain $? would be tee's, which is always 0 and would
          # mask every failure.
          set +e
          claude -p "/dead-code" \
            --model claude-sonnet-4-6 \
            --allowedTools "Read" "Grep" "Glob" "Write" \
                           "Bash(cat:*)" "Bash(wc:*)" 2>&1 | tee dead-code-output.txt
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            [ -s dead-code-output.txt ] ||
              echo "(the CLI wrote nothing to stdout or stderr — it most likely failed to start at all)"
            echo "::error::claude CLI exited $status — its output is in the step log above, and in the dead-code-output artifact."
            exit "$status"
          fi

      - name: Upload raw CLI output
        if: always() && steps.dead-code-run.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: dead-code-output
          path: dead-code-output.txt
          if-no-files-found: warn

      - name: Commit the report and open a PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "dead-code-bot"
          git config user.email "dead-code-bot@users.noreply.github.com"
          if [ -z "$(git status --porcelain docs/dead-code-reports/)" ]; then
            echo "No new report to commit."
            exit 0
          fi

          # main is protected — a required-status-check push here is always
          # rejected (GH013), so land the report via a branch + PR instead.
          DATE=$(date +%Y-%m-%d)
          BRANCH="claude/dead-code-report-$DATE"
          git checkout -B "$BRANCH"
          git add docs/dead-code-reports/
          git commit -m "docs: dead-code sweep $DATE"
          git push -f origin "$BRANCH"

          if gh pr list --head "$BRANCH" --state open --json number \
               | node .github/scripts/check-pr-exists.mjs; then
            echo "PR already open for $BRANCH — nothing further to do."
          else
            gh pr create \
              --title "Dead code report $DATE" \
              --body "Automated weekly dead-code sweep. See \`docs/dead-code-reports/dead-code-$DATE.md\`." \
              --base main --head "$BRANCH" --draft
          fi
