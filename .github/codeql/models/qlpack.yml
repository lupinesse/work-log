# CodeQL model pack — teaches CodeQL about this project's custom sanitisers.
# Loaded via .github/codeql/codeql-config.yml (see codeql-workspace.yml at the
# repo root, which makes this local pack resolvable by name).
name: worklog/js-sanitiser-models
version: 0.0.1
library: true
extensionTargets:
  codeql/javascript-all: '*'
dataExtensions:
  - '*.model.yml'
